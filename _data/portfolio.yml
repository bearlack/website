# ---------------------------------------------------------------------------
# Job gallery. Each entry becomes a captioned photo on /portfolio/.
#
# Suburbs are filled in. When a suburb matches a page in _suburbs/, the
# caption links to it automatically.
#
# ADDING A NEW JOB: copy an entry, set image / alt / suburb / caption.
# Always record the suburb at the time you take the photo — that's what
# makes this page rank locally. Leave suburb blank rather than guessing.
#
# Once suburb is filled in, the page groups by suburb and each photo carries
# real local text — that's what turns a photo wall into something Google can
# rank for "roof cleaning <suburb>".
#
# Leave suburb blank and the job still shows, just without the local angle.
# ---------------------------------------------------------------------------

