    url: /portfolio/
  - title: Blog
    url: /blog/

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

collections:
  suburbs:
    output: true
    permalink: /pressure-cleaning-:path/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "suburbs"
    values:
      layout: "suburb"
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
